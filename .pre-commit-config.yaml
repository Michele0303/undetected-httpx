repos:
- repo: local
  hooks:
    - id: gofmt
      name: gofmt
      entry: gofmt -w
      language: system
      types: [go]
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.14.10
  hooks:
    # Run the linter.
    - id: ruff-check
      files: ^legacy/python/
      types_or: [ python, pyi ]
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
      files: ^legacy/python/
      types_or: [ python, pyi ]
