version: 2
project_name: undetected-httpx

snapshot:
  version_template: '2.0.0-dev'

before:
  hooks:
    - go mod download

builds:
  - id: undetected-httpx
    main: ./cmd/undetected-httpx
    binary: undetected-httpx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Michele0303/undetected-httpx/v2/runner.Version=v{{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - LICENSE.md
      - README.md
      - src: scripts/*.py
        dst: scripts
        strip_parent: false
      - src: docs/*.*
        dst: docs
        strip_parent: false
      - src: docs/demos/v2-live/*.*
        dst: docs/demos/v2-live
        strip_parent: false
      - src: docs/demos/v2-live/capture/*.*
        dst: docs/demos/v2-live/capture
        strip_parent: false
      - src: docs/demos/v2-live/capture/**/*
        dst: docs/demos/v2-live/capture
        strip_parent: false
      - src: legacy/python/README.md
        dst: legacy/python/README.md
        strip_parent: false

checksum:
  name_template: checksums.txt

changelog:
  disable: true

# Build release artifacts here; publish validated archives with gh release create.
release:
  disable: true
